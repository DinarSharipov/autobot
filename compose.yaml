services:
  autobot-bot:
    container_name: autobot-bot
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?TELEGRAM_TOKEN is required}
      BACKEND_URL: ${BACKEND_URL:-http://autobot-api:3000}
      BOT_SERVICE_ACTIVE_KEY_ID: ${BOT_SERVICE_ACTIVE_KEY_ID:-}
      BOT_SERVICE_ACTIVE_SECRET: ${BOT_SERVICE_ACTIVE_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ADMIN_URL: ${WEB_ADMIN_URL:-}
      BUILD_SHA: ${BUILD_SHA:-development}
    networks:
      - autobot-shared
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  autobot-shared:
    external: true
    name: autobot-shared
