name: Bot CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  container:
    name: Build and publish container
    if: github.event_name != 'pull_request'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/dinarsharipov/autobot:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/dinarsharipov/autobot:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  deploy:
    name: Deploy bot to production
    if: github.event_name != 'pull_request'
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: production-bot
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUTOBOT_BOT_IMAGE: ${{ needs.container.outputs.image }}
      BUILD_SHA: ${{ github.sha }}
      PRODUCTION_ENV_FILE: ${{ runner.temp }}/autobot-bot.env
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Render production environment
        run: node scripts/ci/render-production-env.mjs "$PRODUCTION_ENV_FILE"

      - name: Install password SSH fallback
        if: env.SERVER_SSH_KEY == '' && env.SERVER_PASSWORD != ''
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Deploy immutable image
        run: bash scripts/ci/deploy-over-ssh.sh
